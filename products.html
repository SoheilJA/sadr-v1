<body data-page="products" class="bg-white text-ink font-fa antialiased">

<section class="pg-hero"><div class="container-x">
  <nav class="crumb" aria-label="breadcrumb" data-crumb="products"></nav>
  <h1 class="pg-hero-h" data-i18n="products.hero.title"></h1>
  <p class="pg-hero-p max-w-2xl" data-i18n="products.hero.sub"></p>
</div></section>

<!-- نوار ابزار: جستجو / فیلتر / مرتب‌سازی -->
<section class="sticky top-[68px] z-30 bg-white/95 backdrop-blur border-b border-ink/8"><div class="container-x py-3.5 flex flex-col lg:flex-row gap-3 lg:items-center">
  <div class="relative flex-1">
    <span data-icon="search" class="absolute top-1/2 -translate-y-1/2 start-3.5 w-4.5 h-4.5 text-ink/35 pointer-events-none"></span>
    <input id="p-search" class="inp !ps-10" data-i18n-attr="placeholder:products.searchPh">
  </div>
  <div class="flex gap-2 overflow-x-auto no-bar" id="p-cats" role="tablist"></div>
  <select id="p-sort" class="inp lg:w-48">
    <option value="default" data-i18n="products.sort.default"></option>
    <option value="name" data-i18n="products.sort.name"></option>
    <option value="cat" data-i18n="products.sort.cat"></option>
  </select>
</div></section>

<section class="section !pt-8"><div class="container-x">
  <p class="text-sm text-ink/55 mb-5" id="p-count"></p>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="products-grid"></div>
  <div class="empty-state hidden" id="p-empty"><p data-i18n="products.empty"></p></div>
  <p class="text-xs text-ink/40 mt-8 leading-6" data-i18n="products.disclaimer"></p>
</div></section>
