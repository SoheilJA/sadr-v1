<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأمین و توزیع مواد شیمیایی | خاور صدرا</title>
<meta name="description" content="تأمین و توزیع سراسری مواد شیمیایی صنعتی با زنجیره تأمین شفاف و انبارش استاندارد.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l8 5v10l-8 5-8-5V7z' fill='%230B2447'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors:{ ink:{DEFAULT:'#0B2447',700:'#123A6B',900:'#071A33'}, aqua:{DEFAULT:'#0E7C86',400:'#14A3B0'}, sun:'#E8871E', mist:'#F5F7FA', wa:'#25D366' }, fontFamily:{ fa:['Vazirmatn','sans-serif'], en:['Manrope','sans-serif'] }, boxShadow:{ soft:'0 14px 44px -16px rgba(11,36,71,.18)', card:'0 4px 22px -10px rgba(11,36,71,.14)' } } } }</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<link rel="stylesheet" href="../assets/css/custom.css">
<script type="module" src="../assets/js/main.js"></script>
</head>
<body data-page="service-supply" class="bg-white text-ink font-fa antialiased">

<section class="pg-hero"><div class="container-x">
  <nav class="crumb" aria-label="breadcrumb" data-crumb="service:supply"></nav>
  <h1 class="pg-hero-h" data-i18n="sv.supply.hero.title"></h1>
  <p class="pg-hero-p max-w-2xl" data-i18n="sv.supply.hero.sub"></p>
</div></section>

<!-- storytelling: ستون چسبنده + محتوای اسکرول‌شونده -->
<section class="section"><div class="container-x grid lg:grid-cols-3 gap-10">
  <aside class="lg:col-span-1">
    <div class="lg:sticky lg:top-28">
      <div class="card p-6" data-reveal>
        <h2 class="font-extrabold text-lg" data-i18n="sv.supply.side.title"></h2>
        <p class="text-sm text-ink/65 mt-2 leading-7" data-i18n="sv.supply.side.sub"></p>
        <!-- گراف زنجیره تأمین (خط‌کشی با ScrollTrigger) -->
        <svg viewBox="0 0 220 90" class="mt-5 w-full text-aqua" id="chain-svg" aria-hidden="true">
          <path class="draw" d="M20 70 C60 70 60 20 110 20 C160 20 160 70 200 70" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle class="draw" cx="20" cy="70" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle class="draw" cx="110" cy="20" r="7" fill="none" stroke="#E8871E" stroke-width="1.5"/>
          <circle class="draw" cx="200" cy="70" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <p class="text-[11px] text-ink/45 mt-2 flex justify-between"><span data-i18n="sv.supply.chain.a"></span><span data-i18n="sv.supply.chain.c"></span></p>
        <a href="#" class="btn btn-navy w-full mt-5" id="supply-side-cta" data-cta="supply-side"><span data-i18n="common.talkExpert"></span></a>
      </div>
    </div>
  </aside>
  <div class="lg:col-span-2 space-y-14" id="supply-steps"></div>
</div></section>

<section class="bg-mist"><div class="container-x py-16">
  <header class="sec-head"><p class="kicker" data-i18n="sv.supply.faq.kicker"></p><h2 class="h2" data-i18n="sv.supply.faq.title"></h2></header>
  <div class="mt-8 max-w-3xl space-y-3" id="supply-faq"></div>
</div></section>

<section class="section"><div class="container-x">
  <div class="cta-band" data-reveal>
    <div><h2 class="text-xl font-extrabold" data-i18n="sv.supply.cta.title"></h2><p class="mt-2 text-ink/70" data-i18n="sv.supply.cta.sub"></p></div>
    <a href="#" class="btn btn-sun" id="supply-cta" data-cta="supply-bottom"><span data-i18n="common.requestQuote"></span></a>
  </div>
</div></section>

</body>
</html>
